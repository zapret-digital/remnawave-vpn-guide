name: shellcheck

on:
  push:
    paths:
      - install.sh
      - .github/workflows/shellcheck.yml
  pull_request:
    paths:
      - install.sh

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: shellcheck install.sh
